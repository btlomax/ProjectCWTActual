; Quest definitions are compiled into the ROM during `make`.
; Quest and stage IDs must use uppercase letters, numbers, and underscores.
; Set category to primary or secondary and assign an unused VAR_QUEST_* state variable.
; Add stage IDs to `stages` in the order they should occur.
; Each stage needs location and detail text. Detail text can use {progress} and
; {target} for count-based objectives.
; Supported objective_type values are none and caught_species. caught_species
; counts distinct regional Pokédex species and requires a positive target.

[quest.A_NEW_CHALLENGE]
title = A New Challenge
category = primary
state_var = VAR_QUEST_A_NEW_CHALLENGE_STATE
stages = BEGIN, TALK_TO_LARCH, LARCH_POKEDEX, BEAT_WEIRFORD_GYM, FINAL_OBJECTIVE

[quest.A_NEW_CHALLENGE.stage.BEGIN]
location = ALDERBROOK TOWN
detail = Return home to your grandmother
objective_type = none

[quest.A_NEW_CHALLENGE.stage.TALK_TO_LARCH]
location = WESTLOCK VILLAGE
detail = Speak with Professor Larch
objective_type = none

[quest.A_NEW_CHALLENGE.stage.LARCH_POKEDEX]
location = ALDERBROOK TOWN
detail = Meet with Professor Larch at his laboratory
objective_type = none

[quest.A_NEW_CHALLENGE.stage.BEAT_WEIRFORD_GYM]
location = WEIRFORD TOWN
detail = Defeat the Weirford Gym Leader
objective_type = none

[quest.A_NEW_CHALLENGE.stage.FINAL_OBJECTIVE]
location = ROUTE 1
detail = Complete your legendary quest
objective_type = none

[quest.TUTOR_CATCH]
title = Tutor's Challenge
category = secondary
state_var = VAR_QUEST_TUTOR_CATCH_STATE
stages = CATCH_15, RETURN_15, CATCH_35, RETURN_35

[quest.TUTOR_CATCH.stage.CATCH_15]
location = ROUTE 1
detail = Pokémon caught: {progress}/{target}
objective_type = caught_species
target = 15

[quest.TUTOR_CATCH.stage.RETURN_15]
location = Pokémon Tutor
detail = Return to Tutor
objective_type = none

[quest.TUTOR_CATCH.stage.CATCH_35]
location = ROUTE 1
detail = Pokémon caught: {progress}/{target}
objective_type = caught_species
target = 35

[quest.TUTOR_CATCH.stage.RETURN_35]
location = Pokémon Tutor
detail = Return to Tutor
objective_type = none
